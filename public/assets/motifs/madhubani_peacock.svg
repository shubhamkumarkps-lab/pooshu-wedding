<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPeacock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C673"/>
      <stop offset="50%" stop-color="#C8A253"/>
      <stop offset="100%" stop-color="#99732B"/>
    </linearGradient>
    <linearGradient id="peacockTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8C96"/>
      <stop offset="100%" stop-color="#144C54"/>
    </linearGradient>
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C4CE"/>
      <stop offset="100%" stop-color="#D97A8D"/>
    </linearGradient>
  </defs>

  <!-- Central Mithila Lotus -->
  <g id="center-lotus" transform="translate(250, 190)">
    <!-- Base leaf -->
    <path d="M-50,20 C-30,40 30,40 50,20 C30,30 -30,30 -50,20 Z" fill="#2E7D32"/>
    <!-- Central Pod -->
    <ellipse cx="0" cy="0" rx="14" ry="22" fill="#E6C673" stroke="#3D262A" stroke-width="1.5"/>
    <circle cx="0" cy="-6" r="3" fill="#C72C35"/>
    <!-- Outer Petals -->
    <path d="M0,5 C-20,-10 -35,-35 0,-55 C35,-35 20,-10 0,5 Z" fill="url(#lotusPink)" stroke="#3D262A" stroke-width="1.5"/>
    <path d="M-8,5 C-30,-5 -50,-25 -25,-45 C-10,-35 0,-15 -8,5 Z" fill="#FBF0F2" stroke="#3D262A" stroke-width="1.5"/>
    <path d="M8,5 C30,-5 50,-25 25,-45 C10,-35 0,-15 8,5 Z" fill="#FBF0F2" stroke="#3D262A" stroke-width="1.5"/>
    <!-- Decorative dots -->
    <circle cx="-12" cy="-22" r="2" fill="#C72C35"/>
    <circle cx="12" cy="-22" r="2" fill="#C72C35"/>
    <circle cx="0" cy="-35" r="2.5" fill="#C72C35"/>
  </g>

  <!-- Left Peacock -->
  <g id="left-peacock" transform="translate(150, 150)">
    <!-- Long Plume Feather Flow -->
    <path d="M-20,10 C-60,50 -110,60 -130,20 C-145,-15 -110,-50 -60,-40 C-30,-35 -15,-10 -20,10 Z" fill="#E8F4F1" stroke="#3D262A" stroke-width="1.5"/>
    <!-- Plume Ocelli / Eyes -->
    <g transform="translate(-90, 10)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#peacockTeal)" stroke="#3D262A" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="url(#goldPeacock)"/>
      <circle cx="0" cy="0" r="4" fill="#C72C35"/>
    </g>
    <g transform="translate(-60, -15)">
      <ellipse cx="0" cy="0" rx="16" ry="10" fill="url(#peacockTeal)" stroke="#3D262A" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#goldPeacock)"/>
      <circle cx="0" cy="0" r="3" fill="#C72C35"/>
    </g>
    <!-- Peacock Body -->
    <path d="M0,15 C-15,10 -25,-15 -10,-40 C0,-55 25,-60 30,-80 C32,-88 28,-98 35,-105 C42,-112 55,-105 52,-92 C50,-80 40,-65 42,-45 C45,-25 35,5 15,18 Z" fill="url(#peacockTeal)" stroke="#3D262A" stroke-width="2"/>
    <!-- Crest Feathers -->
    <path d="M42,-110 Q48,-128 58,-126" stroke="#C8A253" stroke-width="2" fill="none"/>
    <circle cx="58" cy="-126" r="3.5" fill="#C72C35"/>
    <path d="M40,-110 Q38,-130 42,-132" stroke="#C8A253" stroke-width="2" fill="none"/>
    <circle cx="42" cy="-132" r="3.5" fill="#E6C673"/>
    <path d="M38,-108 Q30,-124 24,-125" stroke="#C8A253" stroke-width="2" fill="none"/>
    <circle cx="24" cy="-125" r="3.5" fill="#C72C35"/>
    <!-- Head & Beak -->
    <polygon points="53,-100 68,-97 53,-93" fill="url(#goldPeacock)" stroke="#3D262A" stroke-width="1"/>
    <!-- Eye -->
    <ellipse cx="44" cy="-100" rx="3.5" ry="5" fill="#FFFFFF" stroke="#3D262A" stroke-width="1"/>
    <circle cx="45" cy="-100" r="2" fill="#3D262A"/>
    <!-- Wing Feathers with Madhubani Hatching -->
    <path d="M10,-35 C-5,-10 -5,15 12,22 C25,26 30,10 25,-15 Z" fill="#FDF4D4" stroke="#3D262A" stroke-width="1.5"/>
    <line x1="5" y1="-20" x2="20" y2="-10" stroke="#C72C35" stroke-width="1"/>
    <line x1="4" y1="-10" x2="22" y2="2" stroke="#C72C35" stroke-width="1"/>
    <line x1="5" y1="2" x2="20" y2="14" stroke="#C72C35" stroke-width="1"/>
  </g>

  <!-- Right Peacock (Mirrored with Traditional Asymmetry) -->
  <g id="right-peacock" transform="translate(350, 150) scale(-1, 1)">
    <!-- Long Plume Feather Flow -->
    <path d="M-20,10 C-60,50 -110,60 -130,20 C-145,-15 -110,-50 -60,-40 C-30,-35 -15,-10 -20,10 Z" fill="#E8F4F1" stroke="#3D262A" stroke-width="1.5"/>
    <!-- Plume Ocelli / Eyes -->
    <g transform="translate(-90, 10)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#peacockTeal)" stroke="#3D262A" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="url(#goldPeacock)"/>
      <circle cx="0" cy="0" r="4" fill="#C72C35"/>
    </g>
    <g transform="translate(-60, -15)">
      <ellipse cx="0" cy="0" rx="16" ry="10" fill="url(#peacockTeal)" stroke="#3D262A" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#goldPeacock)"/>
      <circle cx="0" cy="0" r="3" fill="#C72C35"/>
    </g>
    <!-- Peacock Body -->
    <path d="M0,15 C-15,10 -25,-15 -10,-40 C0,-55 25,-60 30,-80 C32,-88 28,-98 35,-105 C42,-112 55,-105 52,-92 C50,-80 40,-65 42,-45 C45,-25 35,5 15,18 Z" fill="url(#peacockTeal)" stroke="#3D262A" stroke-width="2"/>
    <!-- Crest Feathers -->
    <path d="M42,-110 Q48,-128 58,-126" stroke="#C8A253" stroke-width="2" fill="none"/>
    <circle cx="58" cy="-126" r="3.5" fill="#C72C35"/>
    <path d="M40,-110 Q38,-130 42,-132" stroke="#C8A253" stroke-width="2" fill="none"/>
    <circle cx="42" cy="-132" r="3.5" fill="#E6C673"/>
    <path d="M38,-108 Q30,-124 24,-125" stroke="#C8A253" stroke-width="2" fill="none"/>
    <circle cx="24" cy="-125" r="3.5" fill="#C72C35"/>
    <!-- Head & Beak -->
    <polygon points="53,-100 68,-97 53,-93" fill="url(#goldPeacock)" stroke="#3D262A" stroke-width="1"/>
    <!-- Eye -->
    <ellipse cx="44" cy="-100" rx="3.5" ry="5" fill="#FFFFFF" stroke="#3D262A" stroke-width="1"/>
    <circle cx="45" cy="-100" r="2" fill="#3D262A"/>
    <!-- Wing Feathers with Madhubani Hatching -->
    <path d="M10,-35 C-5,-10 -5,15 12,22 C25,26 30,10 25,-15 Z" fill="#FDF4D4" stroke="#3D262A" stroke-width="1.5"/>
    <line x1="5" y1="-20" x2="20" y2="-10" stroke="#C72C35" stroke-width="1"/>
    <line x1="4" y1="-10" x2="22" y2="2" stroke="#C72C35" stroke-width="1"/>
    <line x1="5" y1="2" x2="20" y2="14" stroke="#C72C35" stroke-width="1"/>
  </g>

  <!-- Traditional Floral Vines below -->
  <path d="M50,260 Q150,230 250,265 Q350,230 450,260" stroke="#C8A253" stroke-width="2" fill="none"/>
  <circle cx="100" cy="245" r="4" fill="#C72C35"/>
  <circle cx="200" cy="252" r="4" fill="#C72C35"/>
  <circle cx="300" cy="252" r="4" fill="#C72C35"/>
  <circle cx="400" cy="245" r="4" fill="#C72C35"/>
</svg>
