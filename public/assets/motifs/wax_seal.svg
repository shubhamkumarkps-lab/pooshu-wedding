<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Organic Wax Droplet Shadow -->
    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3D262A" flood-opacity="0.45"/>
    </filter>
    
    <!-- Realistic Wax Sheen -->
    <radialGradient id="waxBody" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#E54B52"/>
      <stop offset="35%" stop-color="#C52830"/>
      <stop offset="70%" stop-color="#991B22"/>
      <stop offset="100%" stop-color="#600D12"/>
    </radialGradient>

    <!-- Metallic Gold Foil Inner Ring -->
    <linearGradient id="goldMonogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#C29731"/>
      <stop offset="100%" stop-color="#8C6614"/>
    </linearGradient>

    <!-- Emboss Inner Bevel -->
    <radialGradient id="waxBevel" cx="45%" cy="40%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="95%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
    </radialGradient>
  </defs>

  <g filter="url(#waxShadow)">
    <!-- Organic scalloped melted wax rim -->
    <path d="M100,12 C125,10 148,18 165,35 C182,52 190,75 188,100 C186,128 178,152 160,170 C140,188 115,190 92,188 C68,186 42,180 28,162 C10,142 8,118 12,94 C15,70 24,45 42,28 C60,12 78,14 100,12 Z" fill="url(#waxBody)"/>
    <!-- Outer Raised Ring -->
    <circle cx="100" cy="100" r="76" fill="none" stroke="#D32F2F" stroke-width="2.5" opacity="0.6"/>
    <!-- Inner Pressed Matrix -->
    <circle cx="100" cy="100" r="68" fill="#88151B" stroke="url(#goldMonogram)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="68" fill="url(#waxBevel)"/>
    
    <!-- Beaded Ring Accent -->
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#goldMonogram)" stroke-width="1.2" stroke-dasharray="3, 4"/>

    <!-- Sacred Top Lotus Motif -->
    <path d="M100,48 C95,54 90,56 100,64 C110,56 105,54 100,48 Z" fill="url(#goldMonogram)"/>
    <circle cx="93" cy="56" r="1.5" fill="url(#goldMonogram)"/>
    <circle cx="107" cy="56" r="1.5" fill="url(#goldMonogram)"/>

    <!-- P & S Monogram Interlocking -->
    <text x="76" y="112" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="700" fill="url(#goldMonogram)" text-anchor="middle" letter-spacing="-2">P</text>
    <text x="100" y="105" font-family="'Cormorant Garamond', serif" font-size="28" font-style="italic" font-weight="400" fill="#FFE082" text-anchor="middle">&amp;</text>
    <text x="124" y="112" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="700" fill="url(#goldMonogram)" text-anchor="middle" letter-spacing="-2">S</text>

    <!-- Bottom Curved Hashtag Text #pooshu -->
    <path id="curve" d="M 46,128 A 60,60 0 0,0 154,128" fill="none"/>
    <text font-family="'Cinzel Decorative', 'Marcellus', serif" font-size="12" font-weight="700" fill="url(#goldMonogram)" letter-spacing="3">
      <textPath href="#curve" startOffset="50%" text-anchor="middle">
        #POOSHU
      </textPath>
    </text>
  </g>
</svg>
